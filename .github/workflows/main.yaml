name: build-and-commit-to-ghpages
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Adding Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: Install Dependencies
      run: npm install
    - name: Build Angular App
      run: npm run build
    - name: Deploy to gh pages
      run: |
        npx angular-cli-ghpages --dir=dist/va-tools/browser
      env:
        CI: true
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
